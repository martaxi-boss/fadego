services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fadego
      POSTGRES_PASSWORD: fadego_local_only
      POSTGRES_DB: fadego
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fadego -d fadego"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fadego_postgres:/var/lib/postgresql/data

volumes:
  fadego_postgres:
