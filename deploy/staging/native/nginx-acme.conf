# Stage 1: HTTP ACME. Enable only for the approved FADEGO hostname.
# Install as a SEPARATE vhost in the pre-existing Nginx.
server {
    listen 80;
    server_name fadego.duckdns.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://fadego.duckdns.org$request_uri;
    }
}
