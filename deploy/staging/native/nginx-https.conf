# Stage 2: add this block only after a real Let's Encrypt certificate
# has been issued by webroot on the existing HTTP vhost.
server {
    listen 443 ssl;
    server_name fadego.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/fadego.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fadego.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "FADEGO - ambiente de testes";
    auth_basic_user_file /etc/nginx/fadego-staging.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace forwarded client headers; do not trust upstream caller values.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The outer Basic Auth password must never reach the Next.js app.
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
