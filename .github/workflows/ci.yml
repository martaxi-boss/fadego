name: CI

on:
  push:
    branches:
      - main
      - "builder/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fadego
          POSTGRES_PASSWORD: fadego_ci_only
          POSTGRES_DB: fadego
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fadego -d fadego"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fadego:fadego_ci_only@localhost:5432/fadego?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-placeholder-not-a-production-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm --version

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Prisma format
        run: |
          pnpm prisma format
          git diff --exit-code -- prisma/schema.prisma

      - name: Prisma validate
        run: pnpm prisma validate

      - name: Apply migrations to PostgreSQL
        run: |
          pnpm prisma migrate deploy
          pnpm prisma migrate status

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Secret scan
        run: pnpm secret:scan

      - name: Production HTTP smoke
        run: |
          set -euo pipefail
          pnpm start > /tmp/fadego-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 100 /tmp/fadego-start.log
            exit 1
          fi
          node scripts/smoke-runtime.mjs

      - name: Backup/restore rehearsal (ephemeral CI Postgres only)
        env:
          CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/ci-backup-restore.sh

      - name: Capture CI-only visual demos
        if: github.event_name == 'pull_request' && github.head_ref == 'integration/20261016-fadego-candidate'
        run: |
          set -euo pipefail
          export FADEGO_DEMO_EMAIL="ci-demo@fadego.example"
          export FADEGO_DEMO_PASSWORD="$(openssl rand -hex 24)"
          pnpm exec tsx scripts/ci-demo-seed.ts
          npm install --prefix /tmp/fadego-playwright --no-save --no-package-lock --silent playwright@1.56.1
          pnpm start > /tmp/fadego-showroom.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 70 /tmp/fadego-showroom.log
            exit 1
          fi
          node scripts/ci-capture-ux.cjs
          node scripts/ci-e2e-multitenant.cjs

      - name: Upload visual demo gallery
        if: github.event_name == 'pull_request' && github.head_ref == 'integration/20261016-fadego-candidate'
        uses: actions/upload-artifact@v4
        with:
          name: fadego-visual-demo
          path: demo-shots/
          retention-days: 14

      - name: Validate staging container and gateway config
        if: github.event_name == 'pull_request' && github.head_ref == 'integration/20261016-fadego-candidate'
        env:
          FADEGO_STAGING_DB_PASSWORD: ci_fake_hex_password_0000000000000000
          FADEGO_STAGING_NEXTAUTH_SECRET: ci_staging_placeholder_secret_never_deploy
          FADEGO_STAGING_GATE_USER: ci-pilot
          FADEGO_STAGING_GATE_HASH: ci_fake_bcrypt_hash_for_config_only
        run: |
          set -euo pipefail
          docker compose -f deploy/staging/compose.yml --profile dedicated-host config --quiet
          docker build -f deploy/staging/Dockerfile -t fadego-staging:ci .
